        :root {
            --irid-cyan: #00f3ff;
            --irid-pink: #ff00e5;
            --irid-lime: #d4ff00;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.15);
            --bg-void: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: var(--bg-void);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
        }

        
        .hud-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .logo {
            font-weight: 900;
            letter-spacing: 0.5em;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-mark {
            width: 24px;
            height: 24px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: relative;
        }

        .logo-mark::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: linear-gradient(45deg, var(--irid-cyan), var(--irid-pink), var(--irid-lime));
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }

        .top-right-controls {
            display: flex;
            gap: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .control-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .control-item:hover {
            color: var(--irid-cyan);
        }

        
        .hero-content {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
            width: 100%;
        }

        .artist-name {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .song-title {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            letter-spacing: 0.5em;
            color: var(--irid-cyan);
            text-transform: uppercase;
        }

        
        .slide-nav {
            position: absolute;
            right: 60px;
            bottom: 180px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: 'Space Mono', monospace;
            pointer-events: auto;
        }

        .counter {
            font-size: 14px;
            letter-spacing: 0.2em;
        }

        .counter span {
            color: rgba(255,255,255,0.3);
        }

        .nav-arrow {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-arrow:hover {
            background: white;
            color: black;
            border-color: white;
        }

        
        .navigation-wrap {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .nav-capsule {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .nav-item {
            padding: 12px 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: rgba(255,255,255,0.7);
            border-radius: 100px;
            position: relative;
        }

        .nav-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .nav-item.highlight {
            background: linear-gradient(90deg, var(--irid-cyan), var(--irid-pink));
            color: #000;
            font-weight: 700;
        }

        
        .holo-panel {
            position: absolute;
            bottom: calc(100% + 20px);
            left: 0;
            width: 600px;
            background: rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .nav-item[data-trigger="artists"]:hover ~ .holo-panel,
        .holo-panel:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .holo-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 2px);
            pointer-events: none;
        }

        .artist-cat {
            text-align: center;
        }

        .artist-preview {
            width: 100%;
            aspect-ratio: 3/4;
            background: #111;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .artist-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.2);
            transition: filter 0.4s ease;
        }

        .artist-cat:hover img {
            filter: grayscale(0) contrast(1);
        }

        .cat-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.1em;
            color: var(--irid-cyan);
            text-transform: uppercase;
        }

        
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 2;
            background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.05), transparent);
            position: absolute;
            top: -100px;
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -100px; }
            100% { top: 100%; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        
        .meta-data {
            position: absolute;
            left: 40px;
            bottom: 180px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            line-height: 1.8;
            pointer-events: none;
        }

        .meta-data b { color: var(--irid-lime); font-weight: normal; }

    </style>
</head>

    <script vid="66">
        
        document.addEventListener('mousemove', (e) => {
            const artist = document.querySelector('.artist-name');

            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            artist.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        
        setInterval(() => {
            const labels = document.querySelectorAll('.cat-label');
            const target = labels[Math.floor(Math.random() * labels.length)];
            const original = target.innerText;
            if(Math.random() > 0.8) {
                target.innerText = "X_X_X_X";
                setTimeout(() => target.innerText = original, 100);
            }
        }, 3000);
